<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Music</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="player">

  <input id="urlInput" placeholder="Cole URL MP3..." />

  <div class="controls">
    <button id="playBtn">▶</button>
    <button id="pauseBtn">⏸</button>
  </div>

  <input
    type="range"
    min="0"
    max="1"
    step="0.01"
    id="volume"
  >

</div>

<script src="main.js"></script>
</body>
</html>
